#baca variabel dari file .env (opsional, sudah di-.gitignore), contoh isinya di .env.example
spring.config.import=optional:file:.env[.properties]

#koneksi ke Supabase (PostgreSQL) lewat session pooler, nilai diisi di .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#pool kecil: Supabase free tier membatasi jumlah koneksi
spring.datasource.hikari.maximum-pool-size=5

#secret untuk menandatangani JWT (HS256, minimal 32 karakter), nilai diisi di .env
#role user ada di claim "roles" token -> authority ROLE_USER / ROLE_ADMIN
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

#zona waktu jadwal tayang (dipakai untuk batas pembatalan tiket 2 jam sebelum tayang)
bioskop.timezone=Asia/Jakarta

#pagination: ?page=0&size=20, size dibatasi 100; Page dikirim sebagai {"content": [...], "page": {...}}
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

#tampilkan pesan exception (404/409) dan detail validasi (400) di body response error
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

#spring.jpa.show-sql=true
#schema dikelola Flyway (src/main/resources/db/migration), Hibernate hanya mengecek kecocokan entity
spring.jpa.hibernate.ddl-auto=validate

#tabel ada di schema "bioskop", bukan "public", supaya tidak terekspos lewat Supabase Data API
spring.flyway.schemas=bioskop
spring.jpa.properties.hibernate.default_schema=bioskop
